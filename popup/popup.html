<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360" />
    <title>Lulltab</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="sheet">
      <p id="demo" class="demo-banner" hidden>Preview mode — load unpacked in Aside to control real tabs.</p>

      <header class="mast">
        <div class="brand">
          <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
            <path d="M6 104C16 104 21 99 21 90V48C21 37 28 30 39 30H89C100 30 107 37 107 48V90C107 99 112 104 122 104Z" fill="currentColor" />
            <path d="M40 60Q64 84 88 60" fill="none" style="stroke: var(--bg)" stroke-width="10" stroke-linecap="round" />
          </svg>
          <h1 id="wordmark">Lulltab</h1>
        </div>
        <button id="toggle" class="switch" role="switch" aria-checked="true" aria-label="Enable Lulltab">
          <span class="knob"></span>
        </button>
      </header>

      <div class="segment" role="tablist" aria-label="Views">
        <button id="tab-still" type="button" role="tab" aria-selected="true" data-view="still">Tabs</button>
        <button id="tab-memory" type="button" role="tab" aria-selected="false" data-view="memory">Memory</button>
        <button id="tab-debug" type="button" role="tab" aria-selected="false" data-view="debug" hidden>Debug</button>
      </div>

      <div id="view-still">
        <section class="now">
          <div class="tab-row">
            <div id="fav" class="fav" aria-hidden="true">?</div>
            <div class="tab-meta">
              <h2 id="title">This tab</h2>
              <p id="host" class="host">—</p>
            </div>
            <span id="status" class="state">Awake</span>
          </div>
          <p id="why" class="why">Open a page to manage it.</p>
          <div class="actions">
            <button id="sleep" class="btn primary" type="button">Sleep</button>
            <button id="keep" class="btn ghost" type="button" aria-label="Keep site">
              <span class="keep-label">Keep site</span>
              <svg class="keep-mark" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M3.5 8.2 6.4 11.2 12.5 4.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </section>

        <section class="rest">
          <div class="rest-row">
            <p class="kicker">Rest after</p>
            <p class="rest-readout">
              <span id="idle-value">15</span>
              <span id="idle-unit">minutes</span>
            </p>
          </div>
          <input id="idle" class="range" type="range" min="0" max="9" value="3" aria-label="Idle timeout" />
        </section>

        <section class="roster">
          <div class="roster-head">
            <p class="kicker">All tabs</p>
            <p id="counts" class="counts">0 open</p>
          </div>
          <ul id="roster" class="rows"></ul>
          <button id="sleep-others" class="btn ghost wide" type="button">Sleep the rest</button>
        </section>
      </div>

      <div id="view-memory" hidden>
        <section class="rest">
          <div class="rest-row">
            <p class="kicker">Open tabs</p>
            <p class="rest-readout">
              <span id="ram-value">—</span>
              <span id="ram-unit"></span>
            </p>
          </div>
          <p id="ram-sub" class="counts">Measuring…</p>
        </section>
        <p id="ram-note" class="why" hidden></p>
        <section class="roster">
          <div class="roster-head">
            <p class="kicker">By memory</p>
            <button id="ram-refresh" class="btn link" type="button">Refresh</button>
          </div>
          <ul id="ram-list" class="rows"></ul>
        </section>
      </div>

      <div id="view-debug" hidden>
        <section class="roster">
          <div class="roster-head">
            <p class="kicker">Debug</p>
            <p id="debug-counts" class="counts"></p>
          </div>
          <div id="probes" class="probes"></div>
          <div class="actions">
            <button id="debug-copy" class="btn primary" type="button">Copy report</button>
            <button id="debug-clear" class="btn ghost" type="button">Clear log</button>
          </div>
          <p id="debug-copied" class="why" hidden>Copied.</p>
          <ul id="debug-log" class="rows debug-log"></ul>
        </section>
      </div>

      <footer class="foot">
        <a id="options" href="../options/options.html">Settings</a>
      </footer>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
